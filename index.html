<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Principal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos adicionales exclusivos para hacer la portada más atractiva */
        .hero {
            text-align: center;
            padding: 60px 20px;
            margin-top: 50px;
        }
        .hero h1 {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .hero p {
            font-size: 1.2em;
            color: #7f8c8d;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn-gigante {
            background-color: #27ae60;
            color: white;
            padding: 18px 40px;
            font-size: 1.3em;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.3);
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-gigante:hover {
            background-color: #219150;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(39, 174, 96, 0.4);
        }
        .footer-links {
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container wide">
        <div class="form-container hero">
            <h1>Bienvenido al Sistema de Gestión</h1>
            <p>Este es el portal central de registro. Por favor, tenga a la mano su documento de identidad y proceda al formulario para ingresar sus datos en nuestra base de datos segura.</p>
            
            <a href="registro.html" class="btn-gigante">Iniciar Registro de Datos</a>
        </div>

        <div class="footer-links">
            <a href="admin.html" class="admin-link">Acceso exclusivo para Administradores</a>
        </div>
    </div>
</body>
</html>
