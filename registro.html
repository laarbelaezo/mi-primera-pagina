<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ciudadanos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bienvenido al Portal</h1>
            <p>Por favor, ingrese sus datos para completar el registro oficial.</p>
        </header>

        <section class="form-container">
            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Edad:</label>
                    <input type="number" id="edad" placeholder="00">
                </div>
                <div class="form-group">
                    <label>Sexo:</label>
                    <select id="sexo">
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Tipo de ID:</label>
                    <select id="tipo_id">
                        <option value="TI">Tarjeta de Identidad (TI)</option>
                        <option value="CC">Cédula de Ciudadanía (CC)</option>
                        <option value="CE">Cédula de Extranjería (CE)</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Número de ID:</label>
                    <input type="text" id="numero_id" placeholder="12345678">
                </div>
            </div>

            <button id="btn-registrar">Completar Registro</button>
        </section>

        <footer>
            <a href="admin.html" class="admin-link">Acceso Administrativo</a>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
